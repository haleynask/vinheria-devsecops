# Vinheria Agnello — servidor DNS e DHCP da rede interna 172.28.0.0/24

# ---------- DNS ----------
domain-needed
bogus-priv
no-resolv
server=1.1.1.1
domain=vinheria.internal
local=/vinheria.internal/

# Servidores com IP fixo registrados na zona vinheria.internal
host-record=dns.vinheria.internal,172.28.0.2
host-record=catalogo.vinheria.internal,172.28.0.11
host-record=estoque.vinheria.internal,172.28.0.12
host-record=publicacao.vinheria.internal,172.28.0.20

# ---------- DHCP ----------
# Faixa para as estações da loja (fora da faixa de IPs fixos dos servidores)
dhcp-range=172.28.0.100,172.28.0.150,255.255.255.0,12h
dhcp-option=option:router,172.28.0.1
dhcp-option=option:dns-server,172.28.0.2
dhcp-option=option:domain-name,vinheria.internal
dhcp-authoritative

# ---------- Registro ----------
log-queries
log-dhcp
